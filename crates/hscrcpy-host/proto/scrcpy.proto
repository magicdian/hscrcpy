syntax = "proto3";

// Provenance:
// Reconstructed from the generated FileDescriptor embedded in
// xdevice_devicetest-6.1.0.210-py3-none-any.whl/devicetest/controllers/tools/recorder/proto/scrcpy_pb2.py.
// This is not a public Huawei .proto source file and was not recovered by
// reverse engineering the device-side scrcpy shared library.
//
// The observed service has no protobuf package declaration. Keep this file
// package-less so tonic emits /ScrcpyService/<method> paths, matching the
// official scrcpy server.

message ReplyMessage {
  string data = 1;
  int32 reply_type = 2;
  map<string, ParamValue> payload = 3;
}

message ParamValue {
  oneof values {
    int64 val_int = 1;
    double val_double = 2;
    string val_string = 3;
    bool val_bool = 4;
    bytes val_bytes = 5;
    float val_float = 6;
  }
}

message ReplyEndMessage {
  int32 result = 1;
}

message Empty {}

service ScrcpyService {
  rpc onStart(Empty) returns (stream ReplyMessage);
  rpc onEnd(Empty) returns (ReplyEndMessage);
  rpc onRequestIDRFrame(Empty) returns (ReplyEndMessage);
}
